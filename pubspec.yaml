name: mobiboss
description: A clean Google-style Mobile Money POS & SMS reconciliation Flutter application.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  supabase_flutter: ^2.5.0
  flutter_sms_inbox: ^1.0.3
  permission_handler: ^11.3.1
  local_auth: ^2.2.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  pdf: ^3.10.8
  printing: ^5.12.0
  fl_chart: ^0.68.0
  sqflite: ^2.3.3+1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/app_logo.png
    - assets/icons/
